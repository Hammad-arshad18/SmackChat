<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0d1117">
    <meta name="robots" content="noindex">
    <title>Offline — SmackChat</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <style>
        :root {
            color-scheme: dark;
            --bg: #0d1117;
            --panel: #17212c;
            --text: #e6edf3;
            --muted: #8b9bb4;
            --accent: #e23d2b;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 2rem;
            font-family: Inter, system-ui, sans-serif;
            background:
                radial-gradient(ellipse at top, #1a2736 0%, transparent 55%),
                var(--bg);
            color: var(--text);
        }
        main {
            width: min(28rem, 100%);
            padding: 2rem;
            border-radius: 1.25rem;
            background: color-mix(in srgb, var(--panel) 92%, black);
            border: 1px solid color-mix(in srgb, var(--muted) 28%, transparent);
            text-align: center;
        }
        img { width: 64px; height: 64px; margin-bottom: 1rem; }
        h1 {
            margin: 0 0 0.5rem;
            font-size: 1.35rem;
            font-weight: 700;
        }
        p {
            margin: 0 0 1.5rem;
            color: var(--muted);
            line-height: 1.5;
        }
        button {
            appearance: none;
            border: 0;
            border-radius: 999px;
            padding: 0.7rem 1.25rem;
            font: inherit;
            font-weight: 600;
            color: #fff;
            background: var(--accent);
            cursor: pointer;
        }
        button:hover { filter: brightness(1.08); }
    </style>
</head>
<body>
    <main>
        <img src="/icons/icon-192.png" width="64" height="64" alt="SmackChat">
        <h1>You're offline</h1>
        <p>SmackChat needs a connection for chat and attendance. Check your network, then try again.</p>
        <button type="button" onclick="location.reload()">Try again</button>
    </main>
</body>
</html>
