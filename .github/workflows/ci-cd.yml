# CI on every PR / push. SSH deploy to Hostinger on push/merge to main
# (and manual workflow_dispatch).
#
# Uses the GitHub Environment named "production" (Settings → Environments).
# Required Environment secrets (no hardcoded defaults):
#   SSH_HOST                    - server hostname or IP (hPanel → Advanced → SSH Access)
#   SSH_USER                    - SSH username
#   SSH_PORT                    - SSH port
#   SSH_DEPLOY_PATH             - Laravel root on the server (…/public_html/chat)
#   HOSTINGER_SSH_PRIVATE_KEY   - private SSH key (full PEM / OpenSSH block, trailing newline)
#                                 whose public half is added under Hostinger → SSH Access
#
# Required Environment secret (Settings → Environments → production):
#   VITE_PRIMEVUE_LICENSE_KEY   - PrimeVue / PrimeUI license key
#                                 Vite inlines this at build time; server .env is ignored.
#                                 Must be on the production Environment (not only repo secrets
#                                 under a different name, and not only Hostinger .env).
#
name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, ctype, fileinfo, openssl, tokenizer, xml, curl
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Generate app key
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      # PR/CI smoke build only. Licensed production assets are built in the deploy job
      # (which has access to the production Environment secrets).
      - name: Build Vite assets
        run: npm run build

  deploy:
    name: Deploy to Hostinger (SSH)
    needs: [test, frontend]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30

    env:
      DEPLOY_USER: ${{ secrets.SSH_USER }}
      DEPLOY_PORT: ${{ secrets.SSH_PORT }}
      DEPLOY_PATH: ${{ secrets.SSH_DEPLOY_PATH }}
      SSH_OPTS: -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes -o ConnectTimeout=30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require deploy secrets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_DEPLOY_PATH: ${{ secrets.SSH_DEPLOY_PATH }}
          HOSTINGER_SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          VITE_PRIMEVUE_LICENSE_KEY: ${{ secrets.VITE_PRIMEVUE_LICENSE_KEY }}
        run: |
          set -euo pipefail
          missing=0
          for name in SSH_HOST SSH_USER SSH_PORT SSH_DEPLOY_PATH HOSTINGER_SSH_PRIVATE_KEY VITE_PRIMEVUE_LICENSE_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::${name} is empty. Add it under Settings → Environments → production."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          if ! printf '%s' "$HOSTINGER_SSH_PRIVATE_KEY" | grep -q 'BEGIN.*PRIVATE KEY'; then
            echo "::error::HOSTINGER_SSH_PRIVATE_KEY does not look like a private key (missing BEGIN PRIVATE KEY). Paste the private key file contents, not the .pub file."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      # Vite inlines VITE_* here — Hostinger .env is never read by the browser bundle.
      - name: Build Vite assets with PrimeVue license
        env:
          VITE_PRIMEVUE_LICENSE_KEY: ${{ secrets.VITE_PRIMEVUE_LICENSE_KEY }}
        run: |
          set -euo pipefail
          npm run build
          # Confirm the exact secret was baked into the client bundle.
          token_prefix="${VITE_PRIMEVUE_LICENSE_KEY:0:48}"
          if ! grep -R -F --quiet "$token_prefix" public/build; then
            echo "::error::Built assets are missing VITE_PRIMEVUE_LICENSE_KEY. Add it under Environments → production."
            exit 1
          fi
          echo "PrimeVue license token verified in public/build."

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, xml, ctype, json, bcmath, tokenizer, fileinfo, curl, openssl
          coverage: none
          tools: composer:v2

      # Hostinger often disables proc_open, so package:discover must run here (not on the server).
      - name: Discover Laravel packages for deploy
        run: |
          set -euo pipefail
          cp .env.example .env
          php -r "file_put_contents('.env', preg_replace('/^APP_KEY=.*/m', 'APP_KEY=base64:'.base64_encode(random_bytes(32)), file_get_contents('.env')));"
          composer install \
            --no-interaction \
            --prefer-dist \
            --optimize-autoloader \
            --no-dev \
            --ignore-platform-reqs
          php artisan package:discover --ansi
          test -f bootstrap/cache/packages.php
          ls -la bootstrap/cache/

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}

      - name: Verify SSH key login
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          set -euo pipefail
          ssh -p "$DEPLOY_PORT" $SSH_OPTS \
            "${DEPLOY_USER}@${SSH_HOST}" \
            "echo SSH_OK && test -d '${DEPLOY_PATH}' && echo DEPLOY_PATH_OK"

      - name: Sync app files
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          set -euo pipefail
          DEST="${DEPLOY_USER}@${SSH_HOST}:${DEPLOY_PATH}/"
          RSH="ssh -p ${DEPLOY_PORT} ${SSH_OPTS}"

          # No --delete: never remove server-only files (.env, uploads, caches, symlink).
          rsync -az \
            -e "$RSH" \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='vendor/' \
            --exclude='tests/' \
            --exclude='phpunit.xml' \
            --exclude='storage/logs/**' \
            --exclude='storage/framework/cache/**' \
            --exclude='storage/framework/sessions/**' \
            --exclude='storage/framework/views/**' \
            --exclude='storage/app/public/**' \
            --exclude='public/storage' \
            --exclude='bootstrap/cache/**' \
            --exclude='smack-app/' \
            ./ "$DEST"

          ssh -p "$DEPLOY_PORT" $SSH_OPTS \
            "${DEPLOY_USER}@${SSH_HOST}" \
            "mkdir -p '${DEPLOY_PATH}/bootstrap/cache'"

          scp -P "$DEPLOY_PORT" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o BatchMode=yes \
            -o ConnectTimeout=30 \
            bootstrap/cache/packages.php \
            "${DEPLOY_USER}@${SSH_HOST}:${DEPLOY_PATH}/bootstrap/cache/packages.php"

          if [ -f bootstrap/cache/services.php ]; then
            scp -P "$DEPLOY_PORT" \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o BatchMode=yes \
              -o ConnectTimeout=30 \
              bootstrap/cache/services.php \
              "${DEPLOY_USER}@${SSH_HOST}:${DEPLOY_PATH}/bootstrap/cache/services.php"
          fi

      - name: Run remote deploy (composer, migrate, optimize)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          timeout: 60s
          command_timeout: 30m
          request_pty: true
          script_stop: true
          envs: DEPLOY_PATH
          script: |
            set -euo pipefail
            export PATH="$HOME/bin:/usr/local/bin:$PATH"
            cd "$DEPLOY_PATH"
            test -f deploy.sh
            chmod +x deploy.sh
            bash ./deploy.sh
