name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, ctype, fileinfo, openssl, tokenizer, xml, curl
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Generate app key
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build Vite assets
        run: npm run build

      - name: Upload build artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: vite-build
          path: public/build
          retention-days: 3

  deploy:
    name: Publish Hostinger deploy branch
    needs: [test, frontend]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Vite build
        uses: actions/download-artifact@v4
        with:
          name: vite-build
          path: public/build

      - name: Publish to deploy branch
        env:
          DEPLOY_BRANCH: deploy
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          SOURCE_SHA="$(git rev-parse --short HEAD)"

          # Hostinger watches this branch and runs composer install on pull.
          git checkout -B "$DEPLOY_BRANCH"
          git add -f public/build
          git add -A

          if git diff --cached --quiet; then
            echo "No deployable changes."
            exit 0
          fi

          git commit -m "deploy: ${SOURCE_SHA} (built assets for Hostinger)"
          git push --force-with-lease origin "HEAD:${DEPLOY_BRANCH}"

          {
            echo "### Deploy branch updated"
            echo ""
            echo "- Source: \`${SOURCE_SHA}\`"
            echo "- Branch: \`${DEPLOY_BRANCH}\`"
            echo "- Link Hostinger Git auto-deploy to \`Hammad-arshad18/SmackChat\` @ \`${DEPLOY_BRANCH}\` (type: PHP/static)."
            echo ""
            echo "First time on the server:"
            echo "\`\`\`bash"
            echo "cp .env.example .env   # then fill production values"
            echo "php artisan key:generate"
            echo "php artisan migrate --force"
            echo "php artisan storage:link"
            echo "php artisan config:cache && php artisan route:cache && php artisan view:cache"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
